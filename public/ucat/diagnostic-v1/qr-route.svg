<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title"><title id="title">Route A to B: 9 km at 18 km/h; B to C: 14 km at 21 km/h; C to D: 12 km at 24 km/h. Pause 12 minutes at B and 8 minutes at C.</title><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Arial,Helvetica,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold">Sampling route</text><line x1="115" y1="95" x2="520" y2="95" stroke="black" stroke-width="2" /><path d="M 508 89 L 520 95 L 508 101" fill="none" stroke="black" stroke-width="2"/><circle cx="90" cy="95" r="20" fill="white" stroke="black" stroke-width="2"/><text x="90" y="101" text-anchor="middle" font-size="18" font-weight="bold">A</text><circle cx="545" cy="95" r="20" fill="white" stroke="black" stroke-width="2"/><text x="545" y="101" text-anchor="middle" font-size="18" font-weight="bold">B</text><text x="320" y="75" text-anchor="middle" font-size="18" font-weight="normal">9 km at 18 km/h</text><text x="320" y="131" text-anchor="middle" font-size="15" font-weight="normal">Pause at B: 12 minutes</text><line x1="115" y1="225" x2="520" y2="225" stroke="black" stroke-width="2" /><path d="M 508 219 L 520 225 L 508 231" fill="none" stroke="black" stroke-width="2"/><circle cx="90" cy="225" r="20" fill="white" stroke="black" stroke-width="2"/><text x="90" y="231" text-anchor="middle" font-size="18" font-weight="bold">B</text><circle cx="545" cy="225" r="20" fill="white" stroke="black" stroke-width="2"/><text x="545" y="231" text-anchor="middle" font-size="18" font-weight="bold">C</text><text x="320" y="205" text-anchor="middle" font-size="18" font-weight="normal">14 km at 21 km/h</text><text x="320" y="261" text-anchor="middle" font-size="15" font-weight="normal">Pause at C: 8 minutes</text><line x1="115" y1="355" x2="520" y2="355" stroke="black" stroke-width="2" /><path d="M 508 349 L 520 355 L 508 361" fill="none" stroke="black" stroke-width="2"/><circle cx="90" cy="355" r="20" fill="white" stroke="black" stroke-width="2"/><text x="90" y="361" text-anchor="middle" font-size="18" font-weight="bold">C</text><circle cx="545" cy="355" r="20" fill="white" stroke="black" stroke-width="2"/><text x="545" y="361" text-anchor="middle" font-size="18" font-weight="bold">D</text><text x="320" y="335" text-anchor="middle" font-size="18" font-weight="normal">12 km at 24 km/h</text><text x="320" y="391" text-anchor="middle" font-size="15" font-weight="normal">Finish at D</text></g></svg>