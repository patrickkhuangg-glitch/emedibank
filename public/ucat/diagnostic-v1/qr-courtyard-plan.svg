<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title"><title id="title">Courtyard 28 m by 16 m; planted bed 10 m by 4 m; gate 2 m. Separate circular fountain diameter 3.6 m.</title><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Arial,Helvetica,sans-serif"><text x="320" y="27" text-anchor="middle" font-size="20" font-weight="bold">Courtyard plan</text><rect x="85" y="80" width="365" height="210" fill="white" stroke="black" stroke-width="2"/><rect x="220" y="145" width="135" height="65" fill="#eeeeee" stroke="black" stroke-width="2"/><text x="268" y="64" text-anchor="middle" font-size="17" font-weight="normal">28 m</text><text x="51" y="192" text-anchor="middle" font-size="17" font-weight="normal">16 m</text><text x="289" y="136" text-anchor="middle" font-size="16" font-weight="normal">10 m</text><text x="380" y="184" text-anchor="middle" font-size="16" font-weight="normal">4 m</text><text x="288" y="185" text-anchor="middle" font-size="14" font-weight="normal">Planted bed</text><path d="M115 290H160" stroke="white" stroke-width="5"/><text x="138" y="320" text-anchor="middle" font-size="15" font-weight="normal">Gate: 2 m</text><text x="305" y="260" text-anchor="middle" font-size="15" font-weight="normal">Area to resurface</text><circle cx="535" cy="168" r="57" fill="none" stroke="black" stroke-width="2"/><line x1="478" y1="168" x2="592" y2="168" stroke="black" stroke-width="2" /><text x="535" y="153" text-anchor="middle" font-size="16" font-weight="normal">3.6 m</text><text x="535" y="248" text-anchor="middle" font-size="14" font-weight="normal">Proposed fountain</text><text x="535" y="268" text-anchor="middle" font-size="13" font-weight="normal">(separate)</text><text x="320" y="378" text-anchor="middle" font-size="14" font-weight="normal">All dimensions are in metres. Plan not to scale.</text></g></svg>